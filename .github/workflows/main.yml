
name: CI - Mercadinho Facil

on:
  push:
    branches: [main, documentacao-mvp]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Localizar arquivo Java
        run: |
          MAIN_FILE=$(find . -type f -name Main.java -not -path './.git/*' | head -n 1)
          if [ -z "$MAIN_FILE" ]; then
            echo "ERRO: Main.java nao encontrado"
            exit 1
          fi
          echo "Arquivo encontrado: $MAIN_FILE"
          echo "$MAIN_FILE" > main_path.txt

      - name: Compilar projeto
        run: |
          mkdir -p out
          MAIN_FILE=$(cat main_path.txt)
          javac -encoding UTF-8 -d out "$MAIN_FILE"

     
      - name: Verificar compilacao
        run: |
          echo "Arquivos gerados:"
          find out -type f
          CLASS_FILE=$(find out -type f -name Main.class | head -n 1)
          if [ -z "$CLASS_FILE" ]; then
            echo "ERRO: Main.class nao foi gerado"
            exit 1
          fi
          echo "Compilacao verificada: $CLASS_FILE"
